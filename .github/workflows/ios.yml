# Builds Latent (the SwiftUI iPhone and iPad app over the LightCraft engine, apps/latent-ios) on a
# macOS runner into Latent-unsigned.ipa, which Sideloadly or AltStore signs with your Apple ID when
# installing. The earlier egui phone app (apps/lightcraft-ios) is still checked on Linux.
# Setup: docs/ios/BUILD.md
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (release is faster to build; dist is thin-LTO and smaller)"
        type: choice
        options: [release, dist]
        default: release

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The oldest iOS the app supports; must match MinimumOSVersion in Info.plist.in
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  # Fast: the app crate type-checks, lints and passes its tests on Linux (it also runs on a desktop).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p lightcraft-ios -p lightcraft-latent -- --check
      - run: cargo clippy -p lightcraft-ios -p lightcraft-latent --all-targets -- -D warnings
      - run: cargo test -p lightcraft-ios -p lightcraft-latent

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: latent-ios
      - name: Use the newest Xcode (27 for the iOS 27 SDK, else 26)
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$x" ] || x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Latent
        run: apps/latent-ios/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: Latent-iOS
          path: out/Latent-unsigned.ipa
          if-no-files-found: error
