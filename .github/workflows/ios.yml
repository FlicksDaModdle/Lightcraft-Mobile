# Builds Latent (the SwiftUI iPhone and iPad app over the LightCraft engine, apps/latent-ios) on a
# macOS runner into Latent-unsigned.ipa, which Sideloadly or AltStore signs with your Apple ID when
# installing. The earlier egui phone app (apps/lightcraft-ios) is still checked on Linux.
# Setup: docs/ios/BUILD.md
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo profile (release is faster to build; dist is thin-LTO and smaller)"
        type: choice
        options: [release, dist]
        default: release

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The oldest iOS the app supports; must match MinimumOSVersion in Info.plist.in
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  # Fast: the app crate type-checks, lints and passes its tests on Linux (it also runs on a desktop).
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p lightcraft-ios -p lightcraft-latent -- --check
      - run: cargo clippy -p lightcraft-ios -p lightcraft-latent --all-targets -- -D warnings
      - run: cargo test -p lightcraft-ios -p lightcraft-latent

  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: latent-ios
      - name: Use the newest Xcode (27 for the iOS 27 SDK, else 26)
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$x" ] || x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Latent
        env:
          LATENT_VERSION: 0.1.${{ github.run_number }}
          LATENT_BUILD: ${{ github.run_number }}
        run: apps/latent-ios/build.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: Latent-iOS
          path: out/Latent-unsigned.ipa
          if-no-files-found: error

  # Every build of main becomes a GitHub Release and the newest entry in the AltStore source
  # (the `altstore` branch's source.json; add
  # https://raw.githubusercontent.com/FlicksDaModdle/Lightcraft-Mobile/altstore/source.json in AltStore).
  publish:
    needs: ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latent-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.${{ github.run_number }}
      TAG: latent-v0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Latent-iOS
          path: out
      - name: Publish the release
        run: |
          mv out/Latent-unsigned.ipa out/Latent.ipa
          # a re-run of this job finds its release already made
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" out/Latent.ipa --target "$GITHUB_SHA" --title "Latent $VERSION" \
            --notes "Build ${{ github.run_number }} of main ($GITHUB_SHA). Unsigned: AltStore or Sideloadly signs it with your Apple ID."
      - name: Update the AltStore source
        run: |
          size=$(stat -c %s out/Latent.ipa)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Latent.ipa"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/src && cd /tmp/src
          if git ls-remote --exit-code "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" altstore >/dev/null; then
            git clone --depth 1 --branch altstore "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" .
          else
            git init -b altstore . && git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          fi
          python3 "$GITHUB_WORKSPACE/apps/latent-ios/altstore/update_source.py" source.json "$VERSION" "${{ github.run_number }}" "$url" "$size"
          git add source.json
          git commit -m "Latent $VERSION"
          git push origin altstore
