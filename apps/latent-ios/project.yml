# Latent's Xcode project, generated by XcodeGen (`xcodegen generate` in this folder).
# The Rust engine bridge (apps/latent-core) is built first as a static library: see build.sh.
name: Latent
options:
  bundleIdPrefix: app.latent
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Latent:
    type: application
    platform: iOS
    sources:
      - path: Latent
    settings:
      base:
        PRODUCT_NAME: Latent
        PRODUCT_BUNDLE_IDENTIFIER: app.latent.Latent
        INFOPLIST_FILE: Latent/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Latent/Latent-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../latent-core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/aarch64-apple-ios/$(LATENT_RUST_PROFILE)
        LATENT_RUST_PROFILE: release
        OTHER_LDFLAGS: -llightcraft_latent -lc++ -lz -liconv -lresolv -framework Security -framework SystemConfiguration -framework CoreFoundation -framework Metal -framework QuartzCore -framework IOSurface
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
